  0xcfcdbd:0xe5e7ea, 0xf2b8bf:0xf3f4f6, 0xd9dbdc:0xeef0f1, 0xe2e5e8:0xe5e7ea, 0xb0b6bc:0xd1d5db, 0xb3b9bf:0xd1d5db, 0xb6bcc2:0xd1d5db,
  0x2fd13c:0xd9f5d9, 0x3a9b6a:0xd1d5db, 0x2f7fd0:0xd1d5db, 0xf28a3a:0xf4f5f6,
  // services -> site palette
  0xe0b62c:0xe8c43a, 0xe8c62c:0xe8c43a, 0xf09a28:0xe8c43a, 0x8a5a2b:0x9aa33a, 0x6f4a26:0x7d852e,

const renderer = new THREE.WebGLRenderer({antialias:true, preserveDrawingBuffer:true, alpha:true});
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.setClearColor(0xffffff, Q.get('alpha') ? 0 : 1);

renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xffffff, 0xb8bcc2, GREY ? 1.0 : 0.85));
const sun = new THREE.DirectionalLight(0xffffff, GREY ? 0.35 : 0.55);

// ---------- materials ----------
const matCache = {};

    const SV = {0x3ba3ec:0x2f9be8, 0xf4a57a:0xee7a2e, 0xf09a28:0xee7a2e, 0x9aa33a:0x5fcf5f, 0x8fdc8f:0x5fcf5f, 0xd64541:0x5fcf5f, 0xe0b62c:0xd3d6da, 0xe8c62c:0xd3d6da, 0xe2b92e:0xd3d6da, 0x8a5a2b:0xc9ccd0, 0x6f4a26:0xb9bcc0};

}
const lineMat = new THREE.LineBasicMaterial({color: GREY ? 0x8a8a8a : 0x5b6168, transparent:true, opacity: GREY ? 0.9 : 0.55});
const faintLine = new THREE.LineBasicMaterial({color: 0xb5bac0, transparent:true, opacity: 0.45});

// outline shell (inverted hull) for round things, gives a drawn silhouette like Revit
function outlineMat(th) {
  const m = new THREE.MeshBasicMaterial({color: GREY ? 0x8f8f8f : 0x3d4247, side: THREE.BackSide});
  m.onBeforeCompile = (sh) => {
    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `#include <begin_vertex>\n transformed += normal * ${th.toFixed(4)};`);
  };

}
const OUT_PIPE = outlineMat(0.012);
if (REAL) { OUT_PIPE.visible = false; lineMat.visible = false; faintLine.visible = false; }

function addEdges(mesh, lm = lineMat, angle = 25) {

  e.position.copy(mesh.position); e.rotation.copy(mesh.rotation); e.scale.copy(mesh.scale);

}

const V = (x, y, z) => new THREE.Vector3(x, y, z);  // x = east, y = up, z = south

function box(x, y, z, w, h, d, col, o = {}) {
  const g = new THREE.BoxGeometry(w, h, d);
  const m = new THREE.Mesh(g, o.material || mat(col, o));
  m.position.set(x + w/2, y + h/2, z + d/2);
  m.castShadow = o.shadow !== false && !o.transparent;
  m.receiveShadow = true;
  scene.add(m);

}

// ---------- pipe with real bends, flanges, hangers ----------
function pipe(pts, r, col, o = {}) {
  const R0 = o.bend || Math.max(r * 2.5, 0.12);
  const path = new THREE.CurvePath();
  let cur = pts[0].clone();
  for (let i = 1; i < pts.length; i++) {
    const P = pts[i];
    const R = (o.bends && o.bends[i - 1]) || R0;
    if (i < pts.length - 1) {
      const a = P.clone().sub(pts[i-1]).normalize();
      const b = pts[i+1].clone().sub(P).normalize();
      const s = P.clone().addScaledVector(a, -R);
      const e = P.clone().addScaledVector(b, R);

}

// ---------- ladder containment ----------

// ---------- rack ----------
function rackRow(x0, z0, n, facing, o = {}) {
  const rw = 0.6, rd = 1.2, rh = 2.2;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * rw;
    box(x, 0, z0, rw, rh, rd, 0x2e3339, {greyTone: 0xeeeeee});
    // perforated door panel
    const dz = facing > 0 ? z0 + rd : z0 - 0.012;
    texPanel(x + 0.05, 0.12, dz, rw - 0.1, rh - 0.24, 0.012, 'perf', '#3f464e', '#272b30', 14);
    box(x + rw - 0.1, 1.0, facing > 0 ? dz + 0.012 : dz - 0.02, 0.02, 0.25, 0.02, 0xb9bec4, {edges:false, keep:true});

    box(x + 0.15, rh, z0 + 0.3, 0.3, 0.02, 0.15, 0x1f2328, {edges:false, greyTone: 0xe0e0e0});

// ---------- outline / ghost architecture ----------
function ghostBox(x, y, z, w, h, d) {
  if (REAL) return box(x, y, z, w, h, d, 0xd8dadc, {lineMat: faintLine});
  return box(x, y, z, w, h, d, 0xe9ecef, {transparent:true, opacity: GREY ? 0.0 : 0.12, lineMat: faintLine, shadow:false, keep:true});
}


// ---------- textures ----------
const texCache = {};

function valve(p, axis, r, col = 0xc0392b) {
  const s = r * 2.4;

  const hw = new THREE.Mesh(new THREE.TorusGeometry(r * 1.3, r * 0.18, 8, 24), mat(0x2b2f33, {keep:true}));

function cables(x0, z0, x1, z1, y, w, n = 7) {

  const cols = [0x2a2d31, 0x3a3f45, 0x2a2d31, 0x5b6470, 0x2a2d31, 0x1f4e8c, 0x3a3f45, 0x2a2d31];

  box(x - 0.05, top, z - w/2 - 0.06, 0.1, 0.08, w + 0.12, 0x8f959b, {keep:true});
  box(x - 0.15, 0, z - w/2 - 0.15, 0.3, 0.02, w + 0.3, 0x8f959b, {keep:true, edges:false});

// ---------- scenes ----------
function hall() {
  const L = 24, D = 15, CEIL = 5.2;
  box(0, -0.3, 0, L, 0.3, D, 0xf1f2f3, {greyTone: 0xfafafa});
  // columns + perimeter wall ghosts
  if (!REAL) for (const x of [0, 8, 16, 23.5]) for (const z of [0, 14.5]) ghostBox(x, 0, z, 0.5, CEIL, 0.5);
  if (!REAL) { ghostBox(0, 0, 0, L, CEIL, 0.2); ghostBox(0, 0, 0, 0.2, CEIL, D); }

  // fan wall / CRAH units on the north wall
  for (let i = 0; i < 6; i++) {
    const x = 2 + i * 3.4;
    box(x, 0, 0.4, 2.6, 2.3, 0.95, 0xe6e8ea, {greyTone: 0xf7f7f7});
    texPanel(x + 0.15, 0.2, 1.35, 1.1, 1.9, 0.015, 'grille', '#d9dde1', '#9aa1a8', 7); texPanel(x + 1.35, 0.2, 1.35, 1.1, 1.9, 0.015, 'grille', '#d9dde1', '#9aa1a8', 7); box(x + 2.1, 1.6, 1.35, 0.35, 0.5, 0.02, 0x4b5259, {greyTone: 0xe6e6e6});
    box(x + 0.2, 2.3, 0.5, 2.2, 0.25, 0.75, 0xd5d9dd, {greyTone: 0xf0f0f0});
  }
  // rack rows: two hot-aisle pods
  const n = 26, x0 = 3;
  const rows = [[3.4, -1], [5.8, 1], [9.2, -1], [11.6, 1]];
  for (const [z, f] of rows) rackRow(x0, z, n, f);
  // hot aisle containment roof + end doors
  for (const z of [4.6, 10.4]) {
    box(x0, 2.2, z, n * 0.6, 0.04, 1.2, 0xbfe0f2, {transparent:true, opacity: GREY ? 0.15 : 0.45, lineMat: lineMat});
    for (const ex of [x0 - 0.04, x0 + n * 0.6]) box(ex, 0, z, 0.04, 2.2, 1.2, 0xbfe0f2, {transparent:true, opacity: GREY ? 0.15 : 0.45});
  }
  // overhead ladder containment above each row (yellow) + cross run
  const LY = 3.0, YEL = 0xe0b62c;

  cables(x0 - 1.2, 2.2, x0 - 1.2, 13.4, LY, 0.6, 8);

  // fibre tray (orange, higher)
  
  // busway (brown) with tap-off units
  for (const [z, f] of rows) {
    const bz = z + (f > 0 ? 0.2 : 1.0);
    box(x0, 2.7, bz, n * 0.6, 0.14, 0.12, 0x8a5a2b, {greyTone: 0xefefef});
    for (let i = 0; i < n; i += 2) { box(x0 + i * 0.6 + 0.2, 2.42, bz - 0.04, 0.22, 0.28, 0.2, 0x6f4a26, {greyTone: 0xe9e9e9}); cyl(V(x0 + i * 0.6 + 0.31, 2.31, bz + 0.06), 'y', 0.018, 0.22, 0x1d2024, {greyTone:0xe0e0e0, outline:false, seg:8}); }
  }
  // chilled water flow / return mains at high level along north, drops to each CRAH

  box(0, 0, 0, L, H, D, 0, {material: tex('panel', fb, fi, L / 3, H / 3), lineMat: lineMat});
  // louvred plant band at top
  box(-0.05, H - 4, -0.05, L + 0.1, 3.5, D + 0.1, 0, {material: tex('louvre', GREY ? '#f6f6f6' : '#e3e5e7', GREY ? '#cfcfcf' : '#a9aeb3', L / 1.2, 3.5 * 1.5), lineMat: lineMat});
  // parapet
  box(0, H, 0, L, 1.1, 0.3, 0xd0d3d6, {greyTone: 0xf2f2f2}); box(0, H, D - 0.3, L, 1.1, 0.3, 0xd0d3d6, {greyTone: 0xf2f2f2});
  box(0, H, 0, 0.3, 1.1, D, 0xd0d3d6, {greyTone: 0xf2f2f2}); box(L - 0.3, H, 0, 0.3, 1.1, D, 0xd0d3d6, {greyTone: 0xf2f2f2});
  box(0.3, H, 0.3, L - 0.6, 0.05, D - 0.6, 0xc9ccce, {greyTone: 0xf6f6f6, edges:false});
  // white stair / riser enclosures down the middle
  for (let i = 0; i < 6; i++) box(6 + i * 9.5, H, 17, 5, 3.4, 6, 0xf4f5f6, {greyTone: 0xfafafa});
  // orange roof plant units in rows
  const ORG = 0xf28a3a;
  for (const z0 of [2.5, 9.5, 25.5, 32.5]) for (let i = 0; i < 9; i++) {
    const x = 2 + i * 6.8;
    box(x, H, z0, 5.8, 0.25, 2.6, 0x8f959b, {keep:true});
    box(x + 0.1, H + 0.25, z0 + 0.1, 5.6, 1.9, 2.4, ORG, {greyTone: 0xf4f4f4});
    for (let f = 0; f < 3; f++) cyl(V(x + 1.0 + f * 1.8, H + 2.2, z0 + 1.3), 'y', 0.65, 0.06, 0x6a6f74, {greyTone:0xe6e6e6, outline:false});
  }
  // pipe runs between rows
  for (const z of [6.0, 30.5]) { pipe([V(1.5, H + 0.6, z), V(L - 1.5, H + 0.6, z)], 0.25, 0xf3f4f5, {flangeCol: 0xd8262b, flangeStep: 3.4}); pipe([V(1.5, H + 0.6, z + 0.8), V(L - 1.5, H + 0.6, z + 0.8)], 0.25, 0xf3f4f5, {flangeCol: 0xd8262b, flangeStep: 3.4}); }
  // ladder on roof
  ladder(1.5, 23.8, L - 1.5, 23.8, H + 0.4, 0.6, 0xe8c62c, {}); cables(1.5, 23.8, L - 1.5, 23.8, H + 0.4, 0.6, 7);
  // trees (simple)
  for (let i = 0; i < 9; i++) { const x = -4 + i * 8.5; cyl(V(x, 1.5, D + 5), 'y', 0.12, 3, 0x6b5a48, {keep:true, outline:false}); const t = new THREE.Mesh(new THREE.IcosahedronGeometry(1.6, 0), mat(0x7a8088, {greyTone: 0xeeeeee})); t.position.set(x, 4, D + 5); t.castShadow = true; scene.add(t); addEdges(t); }
  return {center: V(L/2, H * 0.6, D/2), persp: {pos: V(-30, 82, 96), fov: 30}};
}

function chillerdeck() {
  const ORA = 0xf4a57a, GRN = 0x8fdc8f, YEL = 0xe0b62c, ORA2 = 0xf09a28;
  const UL = 13.0, UW = 2.6, nV = 10, rows = 2, units = 3;
  const deckY = 6.0, frameY = 3.2, RS = 5.4;
  const L = units * (UL + 1.6);
  box(-2, -0.3, -2.4, L + 3, 0.3, rows * RS + 5, 0xf1f2f3);
  if (REAL) { const f2 = new THREE.DirectionalLight(0xffffff, 0.3); f2.position.set(60, 25, 80); scene.add(f2); }
  const coilMat = new THREE.MeshStandardMaterial({color: 0xe9e7e1, roughness: 0.9, side: THREE.DoubleSide, emissive: 0x3a3a38});
  const finMat = tex('fins', '#dedcd6', '#b9b7b1', 6, 6);
  const vw = UL / nV, vh = deckY - frameY - 0.35;
  for (let r = 0; r < rows; r++) for (let u = 0; u < units; u++) {
    const x0 = u * (UL + 1.6), z0 = r * RS;
    // base frame and legs
    for (let k = 0; k <= 4; k++) for (const dz of [0, UW]) box(x0 + k * (UL / 4) - 0.1, 0, z0 + dz - 0.1, 0.2, frameY, 0.2, 0x8f959b);
    for (const dz of [0, UW]) { box(x0 - 0.1, 1.2, z0 + dz - 0.08, UL + 0.2, 0.12, 0.16, 0x8f959b); }
    // casing: rectangular box frame around the V coils
    for (const dz of [0, UW - 0.12]) { box(x0, frameY, z0 + dz, UL, 0.3, 0.12, 0xe2e0da); box(x0, deckY - 0.3, z0 + dz, UL, 0.3, 0.12, 0xe2e0da); }
    for (let k = 0; k <= nV; k++) for (const dz of [0, UW - 0.12]) box(x0 + k * vw - 0.05, frameY, z0 + dz, 0.1, deckY - frameY, 0.12, 0xe2e0da);
    box(x0, frameY, z0, UL, 0.1, UW, 0xd9d7d1);
    // V-coil modules: triangular prisms spanning the unit width, point down
    for (let k = 0; k < nV; k++) {
      const sh = new THREE.Shape(); sh.moveTo(-vw / 2 + 0.05, 0); sh.lineTo(vw / 2 - 0.05, 0); sh.lineTo(0, -vh); sh.closePath();
      const g = new THREE.ExtrudeGeometry(sh, {depth: UW - 0.24, bevelEnabled: false});
      const m = new THREE.Mesh(g, [coilMat, finMat]); m.position.set(x0 + (k + 0.5) * vw, deckY - 0.3, z0 + 0.12);
      m.castShadow = m.receiveShadow = true; scene.add(m); addEdges(m, lineMat, 30);
    }
    // louvred end panel + control panel
    texPanel(x0 - 0.7, frameY, z0, 0.7, deckY - frameY, UW, 'louvre', '#e6e8ea', '#a8aeb4', 5);
    box(x0 - 0.72, frameY + 0.5, z0 + UW, 0.7, 1.8, 0.35, 0xc9ced3);
    // fan deck + fans (one column per V, two across)
    box(x0, deckY, z0, UL, 0.14, UW, 0xeceae4);
    for (let k = 0; k < nV; k++) for (const dz of [UW * 0.27, UW * 0.73]) {
      const c = V(x0 + (k + 0.5) * vw, deckY + 0.42, z0 + dz);
      cyl(c, 'y', 0.56, 0.56, 0x4b5057, {edges: true, seg: 32});
      cyl(V(c.x, deckY + 0.71, c.z), 'y', 0.5, 0.02, 0x2b2f33, {outline: false, seg: 32});
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.53, 0.018, 6, 40), mat(0x6b7178)); ring.rotation.x = Math.PI / 2; ring.position.set(c.x, deckY + 0.74, c.z); scene.add(ring);
      const ring2 = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.012, 6, 32), mat(0x6b7178)); ring2.rotation.x = Math.PI / 2; ring2.position.set(c.x, deckY + 0.74, c.z); scene.add(ring2);
      box(c.x - 0.53, deckY + 0.73, c.z - 0.01, 1.06, 0.02, 0.02, 0x6b7178, {edges: false}); box(c.x - 0.01, deckY + 0.73, c.z - 0.53, 0.02, 0.02, 1.06, 0x6b7178, {edges: false});
    }
    // pipework under the coils: orange refrigerant/return, green flow, with coil branches
    const pz = z0 + UW / 2;
    pipe([V(x0 - 0.5, frameY - 0.25, pz - 0.45), V(x0 + UL - 0.2, frameY - 0.25, pz - 0.45)], 0.1, ORA, {flanges: false});
    pipe([V(x0 - 0.5, frameY - 0.6, pz + 0.45), V(x0 + UL - 0.2, frameY - 0.6, pz + 0.45)], 0.1, GRN, {flanges: false});
    for (let k = 0; k < nV; k++) {
      const bx = x0 + (k + 0.5) * vw;
      pipe([V(bx - 0.15, frameY - 0.25, pz - 0.45), V(bx - 0.15, frameY + 0.15, pz - 0.45), V(bx - 0.15, frameY + 0.15, pz - 0.15)], 0.04, ORA, {flanges: false});
      pipe([V(bx + 0.15, frameY - 0.6, pz + 0.45), V(bx + 0.15, frameY + 0.15, pz + 0.45), V(bx + 0.15, frameY + 0.15, pz + 0.15)], 0.04, GRN, {flanges: false});
    }
    // compressor / evaporator with connections
    cyl(V(x0 + UL * 0.45, frameY - 1.5, pz), 'x', 0.55, UL * 0.55, 0xdfe2e5, {edges: true});
    for (const sx of [0.25, 0.65]) box(x0 + UL * sx, 0, pz - 0.5, 0.25, frameY - 2.0, 1.0, 0xc4c8cd);
    pipe([V(x0 + UL * 0.75, frameY - 1.5, pz), V(x0 + UL * 0.82, frameY - 1.5, pz), V(x0 + UL * 0.82, frameY - 0.25, pz), V(x0 + UL * 0.82, frameY - 0.25, pz - 0.45)], 0.08, ORA2, {flanges: false});
    const hz1 = rows * RS + 0.4, hz2 = rows * RS + 1.0;
    pipe([V(x0 + 0.6, frameY - 1.5, pz), V(x0 + 0.6, 0.9, pz), V(x0 + 0.6, 0.9, hz1)], 0.14, 0x3ba3ec, {flanges: false});
    pipe([V(x0 + 1.4, frameY - 1.5, pz), V(x0 + 1.4, 1.6, pz), V(x0 + 1.4, 1.6, hz2)], 0.14, ORA, {flanges: false});
    valve(V(x0 + 0.6, 1.4, pz), 'y', 0.14); valve(V(x0 + 1.4, 2.0, pz), 'y', 0.14);
  }
  // main headers
  pipe([V(-1.5, 0.9, rows * RS + 0.4), V(L, 0.9, rows * RS + 0.4)], 0.3, 0x3ba3ec, {flangeCol: 0x374151, flangeStep: 2.4});
  pipe([V(-1.5, 1.6, rows * RS + 1.0), V(L, 1.6, rows * RS + 1.0)], 0.3, ORA, {flangeCol: 0x374151, flangeStep: 2.4});
  for (let x = 0; x < L; x += 3) { pipeStand(x, rows * RS + 0.4, 0.58, 0.7); pipeStand(x + 0.02, rows * RS + 1.0, 1.28, 0.7); }
  // walkway between rows
  const wz = UW + 0.5, ww = RS - UW - 1.0;
  box(-0.5, frameY + 0.1, wz, L, 0.08, ww, 0, {material: tex('grille', '#d9dce0', '#9aa1a8', L * 2, 1), lineMat: lineMat});
  for (const dz of [0.05, ww - 0.05]) { box(-0.5, frameY + 1.15, wz + dz - 0.03, L, 0.06, 0.06, 0xe8c43a); box(-0.5, frameY + 0.6, wz + dz - 0.02, L, 0.04, 0.04, 0xe8c43a); }
  for (let x = 0; x < L; x += 1.8) for (const dz of [0.05, ww - 0.05]) box(x - 0.5, frameY + 0.1, wz + dz - 0.03, 0.06, 1.1, 0.06, 0xe8c43a, {edges: false});
  for (let x = 1; x < L; x += 4) box(x, 0, wz + ww / 2 - 0.08, 0.16, frameY + 0.1, 0.16, 0x8f959b);
  ladder(-1, -0.9, L, -0.9, 2.6, 0.5, YEL, {}); cables(-1, -0.9, L, -0.9, 2.6, 0.5, 6);
  for (let x = 0; x < L; x += 4) box(x, 0, -0.95, 0.1, 2.6, 0.1, 0x8f959b);
  return {center: V(L / 2, 3, rows * RS / 2)};
}

function logomark() {
  const cols = [0x3ba3ec, 0xf4a57a, 0x8fdc8f];
  if (REAL) { scene.children[0].intensity = 0.95; sun.intensity = 0.55; }
  box(-0.1, -0.22, -0.1, 2.7, 0.22, 2.1, 0x9aa0a6);
  box(0, 0, 0, 2.5, 1.9, 1.9, 0xe6e8ea);
  for (let k = 0; k < 6; k++) box(2.5, 0.35 + k * 0.22, 0.2, 0.02, 0.06, 1.5, 0xb3b9bf, {edges: false});
  box(0.2, 0.25, 1.9, 1.0, 1.4, 0.02, 0xd5d9dd); box(1.3, 0.25, 1.9, 1.0, 1.4, 0.02, 0xd5d9dd);
  box(1.12, 0.8, 1.92, 0.05, 0.3, 0.03, 0x6b7178, {edges: false});
  cyl(V(1.25, 1.93, 0.95), 'y', 0.66, 0.06, 0xb3b9bf, {outline: false, seg: 48, edges: true});
  cyl(V(1.25, 1.97, 0.95), 'y', 0.18, 0.04, 0x6b7178, {outline: false, seg: 32});
  const r = 0.17, sp = 0.55, zs = [0.4, 0.4 + sp, 0.4 + 2 * sp], X = -2.6, Yb = 3.1, Zend = 5.3, R0 = 0.45;
  for (let k = 0; k < 3; k++) {
    const z = zs[k], o = 2 - k, Yk = Yb + o * sp;
    const pts = [V(0.05, 0.95, z), V(X, 0.95, z), V(X, Yk, z), V(X, Yk, Zend)];
    pipe(pts, r, cols[k], {bends: [R0, R0 + o * sp], flanges: false});
    const R2 = R0 + o * sp, F = 0x4b5563;
    cyl(V(-1.3, 0.95, z), 'x', r * 1.4, 0.06, F, {keep: true});
    cyl(V(X, (0.95 + R0 + Yk - R2) / 2, z), 'y', r * 1.4, 0.06, F, {keep: true});
    cyl(V(X, Yk, z + R2 + 0.5), 'z', r * 1.4, 0.06, F, {keep: true});
    valve(V(X, Yk, Zend - 1.0), 'z', r, 0x4b5563);
    cyl(V(-0.03, 0.95, z), 'x', r * 1.55, 0.06, 0x4b5563, {keep: true});
  }
  return {center: V(-0.3, 1.9, 2.3)};
}

const info = ({logomark, hall, chillers, generators, plantfloor, roof, chillerdeck})[SCENE]();
window.INFO = info;

let cam;
if (info.persp && !Q.get('crop') && !SITE && !REAL) {
  const pv = (Q.get('view') === 'close' && info.close) ? info.close : info.persp;
  cam = new THREE.PerspectiveCamera(pv.fov, W / H, 0.3, 1000);
  cam.position.copy(pv.pos); cam.lookAt(pv.target || info.center); cam.updateProjectionMatrix();
} else {
// ---------- isometric camera fitted to content ----------
let bb = new THREE.Box3().setFromObject(scene);
const CROP = Q.get('crop');
if (CROP) { const c = CROP.split(',').map(Number); bb = new THREE.Box3(V(c[0], c[1], c[2]), V(c[3], c[4], c[5])); info.center = V((c[0]+c[3])/2, (c[1]+c[4])/2, (c[2]+c[5])/2); }
const QD = Q.get('dir') ? Q.get('dir').split(',').map(Number) : null;
const dir = (QD ? V(QD[0], QD[1], QD[2]) : FRONT ? V(1, 0.34, 0.92) : REAL ? V(1, 0.42, 1.35) : V(1, 0.82, 1)).normalize();
cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -500, 500);
cam.position.copy(info.center.clone().addScaledVector(dir, 100));
cam.up.set(0, 1, 0);
cam.lookAt(info.center);
cam.updateMatrixWorld();
// fit
const corners = [];
for (const x of [bb.min.x, bb.max.x]) for (const y of [bb.min.y, bb.max.y]) for (const z of [bb.min.z, bb.max.z]) corners.push(V(x, y, z).applyMatrix4(cam.matrixWorldInverse));
let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
for (const c of corners) { minX = Math.min(minX, c.x); maxX = Math.max(maxX, c.x); minY = Math.min(minY, c.y); maxY = Math.max(maxY, c.y); }
const pad = (SITE || REAL) ? 0.14 : 0.06, aspect = W / H;
let cw = maxX - minX, ch = maxY - minY, cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
if (cw / ch > aspect) ch = cw / aspect; else cw = ch * aspect;
cam.left = cx - cw/2*(1+pad); cam.right = cx + cw/2*(1+pad); cam.top = cy + ch/2*(1+pad); cam.bottom = cy - ch/2*(1+pad);
cam.updateProjectionMatrix();
}
// shadow camera covers scene
const s = sun.shadow.camera; s.left = -70; s.right = 70; s.top = 70; s.bottom = -70; s.near = 1; s.far = 200;
sun.position.copy(info.center).add(V(-25, 60, 15)); sun.target.position.copy(info.center);
renderer.render(scene, cam);
window.BIG = scene.children.filter(o=>{const b=new THREE.Box3().setFromObject(o);return b.max.x-b.min.x>100}).map(o=>o.type+":"+(o.geometry?o.geometry.type:"")+":"+(o.geometry&&o.geometry.parameters?JSON.stringify(o.geometry.parameters).slice(0,120):"")).slice(0,5);
window.BB = JSON.stringify({min: new THREE.Box3().setFromObject(scene).min, max: new THREE.Box3().setFromObject(scene).max, l: cam.left, r: cam.right, t: cam.top, b: cam.bottom});
window.DONE = true;
</script>
